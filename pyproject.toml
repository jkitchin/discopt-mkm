[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "discopt-mkm"
version = "0.1.0"
description = "Microkinetic modeling plugin for the discopt modeling language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # POUNCE (the default NLP backend, no cyipopt needed) ships in discopt >=0.5.
    "discopt>=0.5",
    "jax>=0.4",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=1.24",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scipy>=1.10",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.28.0",
]

[project.scripts]
discopt-mkm-mcp = "discopt.mkm.mcp_server:main"
discopt-mkm-install-skill = "discopt.mkm.install:main"

[dependency-groups]
dev = [
    "pytest>=8",
    # for building/executing the example notebooks
    "nbformat>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
]

# discopt.mkm is a PEP 420 namespace subpackage: it merges into the ``discopt``
# namespace at import time (discopt's __init__ extends its __path__ via
# pkgutil.extend_path). We deliberately package only ``discopt.mkm`` — never
# ``discopt`` — so this distribution never shadows the base package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["discopt.mkm*"]
namespaces = true

[tool.setuptools.package-data]
"discopt.mkm" = ["skill/SKILL.md"]
